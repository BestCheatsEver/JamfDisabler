name: tests

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
        include:
          - os: ubuntu-latest
            python: "3.8"   # the floor declared in pyproject.toml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: install
        run: python -m pip install --upgrade pip pytest
      - name: run tests
        shell: bash
        run: |
          set -o pipefail
          if python -m pytest -q --tb=short -rf > pytest-output.txt 2>&1; then
            cat pytest-output.txt
            exit 0
          fi
          cat pytest-output.txt
          python - <<'PY'
          import pathlib

          text = pathlib.Path("pytest-output.txt").read_text(errors="replace")
          lines = text.splitlines()
          detail = "\n".join(lines[-120:])
          for i in range(0, min(len(detail), 5000), 800):
              chunk = detail[i : i + 800].replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              print("::error title=pytest failure detail::" + chunk)
          for line in [l for l in lines if l.startswith(("FAILED", "ERROR"))][:25]:
              print("::error title=failed test::" + line.replace("%", "%25"))
          raise SystemExit(1)
          PY

      - name: upload failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output-${{ matrix.os }}-${{ matrix.python }}
          path: pytest-output.txt
          if-no-files-found: ignore
          retention-days: 3

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - run: ruff check .

  cli-smoke:
    name: cli smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: run the CLI (dry-run and read-only commands only)
        shell: bash
        run: |
          set -euo pipefail
          python -m jamfdisabler --version
          python -m jamfdisabler list > /dev/null
          python -m jamfdisabler scan --no-color > /dev/null
          python -m jamfdisabler status --json > /dev/null
          tmp="$(mktemp -d)"
          printf '127.0.0.1 localhost\n' > "$tmp/hosts"
          python -m jamfdisabler on --dry-run --hosts-file "$tmp/hosts" --state-dir "$tmp/state" --no-color > /dev/null
          cmp <(printf '127.0.0.1 localhost\n') "$tmp/hosts"
