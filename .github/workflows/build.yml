name: build

# Builds the stand-alone "full build" executables with PyInstaller:
#   macOS (arm64 + intel), Linux (x86_64), Windows (x86_64)
#
# * Every push / manual run produces downloadable artifacts.
# * Pushing a tag like v1.0.0 also attaches them to a GitHub Release.

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: macos-arm64
            asset: JamfDisabler-macos-arm64
          # macos-13 (Intel) was retired by GitHub; macos-15-intel replaces it.
          - os: macos-15-intel
            label: macos-x86_64
            asset: JamfDisabler-macos-x86_64
          - os: ubuntu-latest
            label: linux-x86_64
            asset: JamfDisabler-linux-x86_64
          - os: windows-latest
            label: windows-x86_64
            asset: JamfDisabler-windows-x86_64.exe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install build dependency
        run: python -m pip install --upgrade pip pyinstaller

      - name: build (single file)
        run: python scripts/build.py --name JamfDisabler

      - name: smoke test the binary (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          ./dist/JamfDisabler --version
          ./dist/JamfDisabler list > /dev/null
          ./dist/JamfDisabler status --json > /dev/null
          tmp="$(mktemp -d)"
          printf '127.0.0.1 localhost\n' > "$tmp/hosts"
          ./dist/JamfDisabler on --dry-run --hosts-file "$tmp/hosts" --state-dir "$tmp/state" --no-color > /dev/null

      - name: smoke test the binary (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\dist\JamfDisabler.exe --version
          .\dist\JamfDisabler.exe list | Out-Null
          .\dist\JamfDisabler.exe status --json | Out-Null

      - name: build portable .pyz (linux only)
        if: matrix.label == 'linux-x86_64'
        run: |
          python scripts/build.py --zipapp --name JamfDisabler

      - name: upload portable .pyz
        if: matrix.label == 'linux-x86_64'
        uses: actions/upload-artifact@v4
        with:
          name: JamfDisabler.pyz
          path: dist/JamfDisabler.pyz
          if-no-files-found: error

      - name: rename artifact (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: cp dist/JamfDisabler "dist/${{ matrix.asset }}" && chmod +x "dist/${{ matrix.asset }}"

      - name: rename artifact (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item dist/JamfDisabler.exe "dist/${{ matrix.asset }}"

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

      - name: attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if ! gh release view "$tag" > /dev/null 2>&1; then
            gh release create "$tag" --title "JamfDisabler $tag" --generate-notes
          fi
          gh release upload "$tag" "dist/${{ matrix.asset }}" --clobber
          if [ -f dist/JamfDisabler.pyz ]; then
            gh release upload "$tag" dist/JamfDisabler.pyz --clobber
          fi
