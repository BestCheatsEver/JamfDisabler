name: tests

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
        include:
          - os: ubuntu-latest
            python: "3.8"   # the floor declared in pyproject.toml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: install
        run: python -m pip install --upgrade pip pytest
      - name: run tests
        run: python -m pytest -q

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - run: ruff check .

  cli-smoke:
    name: cli smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: run the CLI (no changes: dry-run/read-only commands only)
        shell: bash
        run: |
          set -euo pipefail
          python -m jamfdisabler --version
          python -m jamfdisabler list > /dev/null
          python -m jamfdisabler scan --no-color > /dev/null
          python -m jamfdisabler status --json > /dev/null
          tmp="$(mktemp -d)"
          printf '127.0.0.1 localhost\n' > "$tmp/hosts"
          python -m jamfdisabler on --dry-run --hosts-file "$tmp/hosts" --state-dir "$tmp/state" --no-color > /dev/null
          cmp <(printf '127.0.0.1 localhost\n') "$tmp/hosts"
